<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>projects · cammy-the-cat</title>
  <meta name="description" content="Projects by Cammy: local AI, Rust systems, graphics, web and games.">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/">~/cammy</a>
    <nav>
      <a href="/projects/">projects</a>
      <a href="/about/">about</a>
      <a href="/external/">external</a>
      <a href="/socials/">socials</a>
      <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
        <span class="icon-dark">☾</span><span class="icon-light">☀</span>
      </button>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <p class="prompt">$ ls projects/</p>
      <div class="section-head">
        <h1>projects <span id="count" class="muted"></span></h1>
        <div id="filters" class="filters" role="group" aria-label="Filter projects"></div>
      </div>
    </section>
    <section>
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> cammy-the-cat</span>
    <span class="muted">built by hand, themed by you</span>
  </footer>

  <script src="/projects/projects.js"></script>
  <script src="/script.js"></script>
</body>
</html>
